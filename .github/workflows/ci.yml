name: .NET Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'  # or your target framework version

    - name: Restore dependencies
      run: dotnet restore  src/DamLoad.sln

    - name: Build solution
      run: dotnet build src/DamLoad.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test src/DamLoad.sln --no-build --configuration Release --verbosity normal